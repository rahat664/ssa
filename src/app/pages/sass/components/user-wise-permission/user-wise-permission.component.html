<div class="flex flex-col space-y-2 md:mx-3 pb-4" xmlns="http://www.w3.org/1999/html">
    <div
            appGetElementHeight
            (height)="height = $event"
            class="flex flex-col space-y-3 sticky top-16 z-50 bg-app-bg py-3">
        <div
                class="flex flex-col py-[1.375rem] sm:py-[1.125rem] md:py-[1rem] md:py-[0.875rem] xl:py-[0.75rem] 2xl:py-[0.625rem] space-y-3 md:space-y-0 md:flex-row justify-between">
            <div class="flex flex-col space-y-2 justify-between w-full px-3">
                <h1 class="text-h1_mobile leading-h1_mobile md:text-h1 md:leading-h1 font-semibold">Role Wise
                    Permission</h1>
            </div>
        </div>
        <div class="p-4 bg-white rounded-lg flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
            <div class="flex flex-col space-y-2 ">
                <label for="enterpriseId" class="text-body_title leading-body_title text-web-text-secondary">Enterprise</label>
                <mat-form-field appearance="outline" class="example-full-width">
                    <mat-select
                            (selectionChange)="onChangeEnterprise($event)"
                            id="enterpriseId"
                            [(ngModel)]="enterpriseId"
                            placeholder="Select Enterprise">
                        <mat-option *ngFor="let ent of enterprise" [value]="ent.id">
                            {{ ent.name }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="flex-1">
                <label for="userSearch" class="text-body_title leading-body_title text-web-text-secondary">Search Users</label>
                <div class="relative flex items-center">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <img src="assets/svg/search.svg" class="notPreview" alt="search"/>
                    </div>
                    <button
                            (click)="onClickClear()"
                            *ngIf="searchTerm"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <i class="far fa-times text-gray-500 text-xs"></i>
                    </button>
                    <input id="userSearch"
                           [(ngModel)]="searchTerm"
                           (ngModelChange)="onSearchChange($event)"
                           (keyup)="onKeyUpSearch($event)"
                           type="text"
                           placeholder="Search by name, username, email, phone"
                           class="border border-disabled rounded-lg pl-10 pr-8 py-2 w-full outline-none focus:border-primary"/>
                </div>
            </div>
        </div>
    </div>
    <div appGiveMaxHeight
         [totalPage]="1"
         [anotherItemsHeight]="height" class="">
        <div class="flex flex-col space-y-3">
        <div class="flex flex-col space-y-2">
            <h2 class="text-h2_mobile leading-h2_mobile md:text-h2 md:leading-h2 font-semibold">Active Users</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3" *ngIf="activeUsersPage?.length; else noActive">
                <app-user-card
                        (cardClick)="onUserCardClick(user)"
                        *ngFor="let user of activeUsersPage"
                        [name]="user.name"
                        [email]="user.email || user.username"
                        [role]="user.primaryRole"
                        [rolesCount]="user.roleNames?.length || 0"
                        [rolesList]="user.roleNames"
                        [status]="'active'"
                        [avatarUrl]="user.image">
                </app-user-card>
            </div>
            <ng-template #noActive>
                <div class="flex flex-col items-center justify-center py-10 space-y-4">
                    <img src="assets/svg/no-data.svg" alt="No Active Users" class="w-32 h-32">
                    <h3 class="text-h3_mobile leading-h3_mobile md:text-h3 md:leading-h3 font-semibold text-not-black">No active users</h3>
                </div>
            </ng-template>
        </div>
        <div class="flex flex-col space-y-2">
            <h2 class="text-h2_mobile leading-h2_mobile md:text-h2 md:leading-h2 font-semibold">Inactive Users</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3" *ngIf="inactiveUsersPage?.length; else noInactive">
                <app-user-card class="cursor-pointer"
                        (cardClick)="onUserCardClick(user)"
                        *ngFor="let user of inactiveUsersPage"
                        [name]="user.name"
                        [email]="user.email || user.username"
                        [role]="user.primaryRole"
                        [rolesCount]="user.roleNames?.length || 0"
                        [rolesList]="user.roleNames"
                        [status]="'inactive'"
                        [avatarUrl]="user.image">
                </app-user-card>
            </div>
            <ng-template #noInactive>
                <div class="flex flex-col items-center justify-center py-10 space-y-4">
                    <img src="assets/svg/no-data.svg" alt="No Inactive Users" class="w-32 h-32">
                    <h3 class="text-h3_mobile leading-h3_mobile md:text-h3 md:leading-h3 font-semibold text-not-black">No inactive users</h3>
                </div>
            </ng-template>
        </div>
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 pt-4">
            <div class="text-sm text-secondary">Page {{currentPage + 1}} of {{totalPages}} ({{totalUsers}} users)</div>
            <div class="flex items-center gap-2">
                <button class="px-3 py-2 border border-disabled rounded-lg bg-white text-secondary hover:bg-app-bg disabled:opacity-50"
                        (click)="prevPage()" [disabled]="currentPage === 0">
                    Previous
                </button>
                <button class="px-3 py-2 border border-disabled rounded-lg bg-white text-secondary hover:bg-app-bg disabled:opacity-50"
                        (click)="nextPage()" [disabled]="currentPage + 1 >= totalPages">
                    Next
                </button>
            </div>
        </div>
        </div>
    </div>
</div>
