<div class="flex flex-col space-y-2 md:mx-3 pb-4">
  <div
    appGetElementHeight
    (height)="height = $event"
    class="flex flex-col space-y-3 sticky top-16 z-50 bg-app-bg py-3">
    <div
      class="flex flex-col py-[1.375rem] sm:py-[1.125rem] md:py-[1rem] xl:py-[0.75rem] 2xl:py-[0.625rem] space-y-3 md:space-y-0 md:flex-row justify-between">
      <div class="flex flex-col space-y-2 justify-between w-full px-3">
        <h1 class="text-h1_mobile leading-h1_mobile md:text-h1 md:leading-h1 font-semibold">User Wise Permission</h1>
        <p class="text-body-medium text-secondary-text">Review users and their assigned roles.</p>
      </div>
    </div>
  </div>
  <div appGiveMaxHeight
       [totalPage]="1"
       [anotherItemsHeight]="height">
    <div class="flex flex-col space-y-3">
      <div class="flex flex-col space-y-2">
        <h2 class="text-h2_mobile leading-h2_mobile md:text-h2 md:leading-h2 font-semibold">Users</h2>
        <div class="grid grid-cols-3 gap-3" *ngIf="users?.length > 0; else noUsers">
          <app-user-role-card [card]="user" *ngFor="let user of users"></app-user-role-card>
        </div>
        <ng-template #noUsers>
          <div class="flex flex-col items-center justify-center py-10 space-y-4" *ngIf="!loading">
            <img src="assets/svg/no-data.svg" alt="No Users" class="w-32 h-32">
            <h3 class="text-h3_mobile leading-h3_mobile md:text-h3 md:leading-h3 font-semibold text-not-black">No users
              found</h3>
          </div>
          <div class="flex items-center justify-center py-10" *ngIf="loading">
            <p class="text-body-medium text-secondary-text">Loading users...</p>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
