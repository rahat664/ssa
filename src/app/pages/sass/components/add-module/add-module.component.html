<div class="dialog-shell px-16 py-10 relative">
  <div>
    <h1 class="text-h2 leading-h2 md:text-h2 md:leading-h2 font-semibold">Add new module</h1>
    <button (click)="onCloseAddModule()" class="absolute top-8 right-8">
    <span class="material-icons text-gray-500 text-xl leading-none">close</span>
    </button>
  </div>
  <div class="dialog-body">
    <form [formGroup]="moduleForm" (ngSubmit)="onSubmitModule()" class="py-9 flex flex-col space-y-6">
      <div class="flex flex-col space-y-2 w-full">
        <label for="name" class="text-body_title leading-body_title text-web-text-secondary">Name</label>
        <mat-form-field appearance="outline" class="example-full-width" [ngClass]="{
              error: moduleForm.get('name').invalid && moduleForm.get('name').touched,
            }">
          <input
            appAlphabetOnly
            id="name"
            [minLength]="2"
            [maxLength]="50"
            type="text"
            matInput
            formControlName="name"
            placeholder="Module Name"/>
        </mat-form-field>
        <div *ngIf="moduleForm.get('name').touched && moduleForm.get('name').invalid" class="text-red text-xs">
          <span>Module name is required</span>
        </div>
      </div>
      <button type="submit"
              class="bg-primary text-white rounded-lg px-6 py-3 font-semibold text-base leading-base hover:bg-blue-hover focus:outline-none focus:ring-2 focus:ring-blue-focus focus:ring-opacity-50">
        <span *ngIf="loading" class="material-icons animate-spin mr-2 text-base">refresh</span>
        Add Module
      </button>
    </form>
  </div>
</div>
