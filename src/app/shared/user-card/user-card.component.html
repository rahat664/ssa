<div class="user-card" (click)="onCardClick()">
  <div class="user-card__avatar">
    <img  [src]="avatarUrl || defaultAvatar"
         (error)="handleImgError($event)"
         alt="{{ name || 'User avatar' }}"/>
  </div>
  <div class="user-card__body">
    <div class="user-card__top">
      <div>
        <div class="user-card__name">{{ name || 'Unknown user' }}</div>
        <div class="user-card__email" *ngIf="email">{{ email }}</div>
      </div>
      <span class="badge" [ngClass]="statusClass()">{{ status }}</span>
    </div>
    <div class="user-card__meta">
      <span class="user-card__role" *ngIf="role; else noRole">{{ role }}</span>
      <ng-template #noRole><span class="user-card__role">No role set</span></ng-template>
      <span class="user-card__roles-chip"
            *ngIf="rolesCount && rolesCount > 0"
            [attr.title]="rolesList && rolesList.length ? rolesList.join(', ') : ''">
        {{ rolesCount }} role{{ rolesCount === 1 ? '' : 's' }}
      </span>
    </div>
  </div>
</div>
